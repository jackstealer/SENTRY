      expect:
        intent: review
        tools:
          - name: get_stats
            args: {range: week}

- id: review-month
  now: "2026-11-23T21:00:00+05:30"
  turns:
    - say: "give me a review of the last month"
      expect:
        intent: review
        tools:
          - name: get_stats
            args: {range: month}

- id: review-habits-week
  now: "2026-11-23T21:00:00+05:30"
  setup:
    habits: [{name: "Gym", rrule: "FREQ=DAILY", period: week, target_per_period: 4}]
  turns:
    - say: "how are my habits doing this week?"
      expect:
        intent: [review, query]
        tools:
          - name: get_habits_status
