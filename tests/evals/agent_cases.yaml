- id: review-push-task
  now: "2026-11-23T20:00:00+05:30"
  setup:
    tasks: [{title: "Submit SE assignment", due_at: "2026-11-23T23:00:00+05:30"}]
  turns:
    - say: "I won't finish the SE assignment tonight, push it to tomorrow 5pm"
      expect:
        intent: [review, manage, checkin, plan]
        tools:
          - name: update_task
            args: {task_id: {ref: tasks.0}, due_at: "2026-11-24T17:00:00+05:30"}

# --- preference -------------------------------------------------------------------------------

- id: pref-no-tasks-before
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "never schedule tasks before 7am"
      expect:
        intent: preference
        tools:
          - name: set_preference
            args: {key: no_tasks_before, value: {any_of: ["07:00", {time: "07:00"}]}}

- id: pref-quiet-hours
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "my quiet hours are 11:30pm to 6:30am"
      expect:
        intent: preference
        tools:
          - name: set_preference
            args: {key: quiet_hours, value: {start: "23:30", end: "06:30"}}

- id: pref-default-reminder
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "by default remind me 30 minutes before things"
      expect:
        intent: preference
        tools:
          - name: set_preference
            args: {key: default_reminder_min, value: {any_of: [30, {minutes: 30}]}}

- id: pref-remember
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "remember that I prefer deep work after 9pm"
      expect:
        intent: preference
        tools:
          - name: remember
            args: {content: {contains: "deep work"}}

- id: pref-forget-confirmed
  now: "2026-11-23T10:00:00+05:30"
  setup:
    memories: [{content: "Has a dog named Bruno", kind: fact}]
  turns:
    - say: "forget that I have a dog"
      expect:
        intent: preference
        confirmation: true
        tools:
          - name: forget
    - say: "yes"
      expect:
        tools:
          - name: forget

# --- manage -----------------------------------------------------------------------------------

- id: manage-move-routine
  now: "2026-11-23T10:00:00+05:30"
  setup:
    routines:
      - {title: "Gym", category: fitness, rrule: "FREQ=DAILY", start_time: "18:00", duration_min: 90}
  turns:
    - say: "move my gym to 7pm"
      expect:
        intent: [manage, plan]
        tools:
          - name: update_routine
            args: {routine_id: {ref: routines.0}, start_time: "19:00"}

- id: manage-delete-habit-confirmed
  now: "2026-11-23T10:00:00+05:30"
  setup:
    habits: [{name: "Reading", rrule: "FREQ=DAILY"}]
  turns:
    - say: "delete the reading habit"
      expect:
        intent: manage
        confirmation: true
        tools:
          - name: delete_habit
            args: {habit_id: {ref: habits.0}}
    - say: "yes, delete it"
      expect:
        tools:
          - name: delete_habit
            args: {habit_id: {ref: habits.0}}

- id: manage-archive-done-confirmed
  now: "2026-11-23T10:00:00+05:30"
  setup:
    done_tasks:
      - {title: "Old lab report", completed_at: "2026-11-10T12:00:00+05:30"}
      - {title: "Old quiz", completed_at: "2026-11-15T12:00:00+05:30"}
  turns:
    - say: "clear out all my completed tasks"
      expect:
        intent: manage
        confirmation: true
        tools:
          - name: archive_tasks
            args: {completed_before: {present: true}}
    - say: "yes go ahead"
      expect:
        tools:
          - name: archive_tasks

- id: manage-archive-declined
  now: "2026-11-23T10:00:00+05:30"
  setup:
    done_tasks: [{title: "Old lab report", completed_at: "2026-11-10T12:00:00+05:30"}]
  turns:
    - say: "delete all done tasks"
      expect:
        intent: manage
        confirmation: true
        tools:
          - name: archive_tasks
    - say: "no wait, keep them"
      expect: {}

- id: manage-cancel-reminder
  now: "2026-11-23T10:00:00+05:30"
  setup:
    reminders: [{message: "Call mom", fire_at: "2026-11-23T20:00:00+05:30"}]
  turns:
    - say: "cancel the call mom reminder"
      expect:
        intent: [manage, checkin]
        tools:
          - name: cancel_reminder
            args: {reminder_id: {ref: reminders.0}}

- id: manage-rename-habit
  now: "2026-11-23T10:00:00+05:30"
  setup:
    habits: [{name: "DSA practice", rrule: "FREQ=DAILY"}]
  turns:
    - say: "rename my DSA habit to LeetCode daily"
      expect:
        intent: manage
        tools:
          - name: update_habit
            args: {habit_id: {ref: habits.0}, name: {contains: "LeetCode"}}

