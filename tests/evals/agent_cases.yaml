# Agent eval cases (ROADMAP 3.8). Run against the real API with: uv run python scripts/run_evals.py
# Format and matchers: sentry_ai/agent/evals.py. Each case runs on a fresh, rolled-back DB.
# Most cases use Monday 23 Nov 2026, 10:00 IST: "tomorrow" is the 24th, "friday" the 27th.
# Expected tools must be called in order with matching key args; extra READ calls are fine,
# any unexpected write or destructive call fails the case.

# --- capture ----------------------------------------------------------------------------------

- id: capture-task-due-friday
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "remind me to submit SE assignment friday 5pm"
      expect:
        intent: capture
        tools:
          - name: create_task
            args: {title: {contains: "SE assignment"}, due_at: "2026-11-27T17:00:00+05:30"}

- id: capture-reminder-tonight
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "remind me to call mom at 8"
      expect:
        intent: capture
        tools:
          - name: create_reminder
            args: {message: {contains: "mom"}, fire_at: "2026-11-23T20:00:00+05:30"}

- id: capture-habit-nightly
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "start tracking reading, 20 minutes every night at 11pm"
      expect:
        intent: capture
        tools:
          - name: create_habit
            args: {name: {contains: "read"}, rrule: {contains: "FREQ=DAILY"}, preferred_time: "23:00"}

- id: capture-routine-gym
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "I go to the gym monday to saturday at 6pm for an hour and a half"
      expect:
        intent: capture
        tools:
          - name: create_routine
            args:
              title: {contains: "gym"}
              start_time: "18:00"
              duration_min: 90
              rrule: {contains: "BYDAY=MO,TU,WE,TH,FR,SA"}

- id: capture-undated-task
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "add buy groceries to my list"
      expect:
        intent: capture
        tools:
          - name: create_task
            args: {title: {contains: "groceries"}, due_at: {present: false}}

# --- checkin ----------------------------------------------------------------------------------

- id: checkin-done-fuzzy-task
  now: "2026-11-23T10:00:00+05:30"
  setup:
    tasks: [{title: "Submit SE assignment", due_at: "2026-11-27T17:00:00+05:30", priority: 1}]
  turns:
    - say: "done with the SE thing"
      expect:
        intent: checkin
        tools:
          - name: complete_task
            args: {task_id: {ref: tasks.0}}

- id: checkin-habit-done
  now: "2026-11-23T19:30:00+05:30"
  setup:
    habits: [{name: "Workout", rrule: "FREQ=DAILY"}]
  turns:
    - say: "done workout"
      expect:
        intent: checkin
        tools:
          - name: log_habit
            args:
              - {habit_id: {ref: habits.0}, status: done}
              - {habit_name: {contains: "workout"}, status: done}

- id: checkin-habit-skip
  now: "2026-11-23T21:30:00+05:30"
  setup:
    habits: [{name: "DSA practice", rrule: "FREQ=DAILY", preferred_time: "21:00"}]
  turns:
    - say: "skipping DSA today, too tired"
      expect:
        intent: checkin
        tools:
          - name: log_habit
            args:
              - {habit_id: {ref: habits.0}, status: skipped}
              - {habit_name: {contains: "DSA"}, status: skipped}

- id: checkin-snooze-reminder
  now: "2026-11-23T10:00:00+05:30"
  setup:
    reminders: [{message: "Call mom", fire_at: "2026-11-23T10:30:00+05:30"}]
  turns:
    - say: "snooze the call mom reminder by 15 minutes"
      expect:
        intent: checkin
        tools:
          - name: snooze_reminder
            args: {reminder_id: {ref: reminders.0}, minutes: 15}

- id: checkin-skip-task
  now: "2026-11-23T10:00:00+05:30"
  setup:
    tasks: [{title: "Laundry", due_at: "2026-11-23T18:00:00+05:30"}]
  turns:
    - say: "I'm not doing the laundry today, skip it"
      expect:
        intent: [checkin, manage]
        tools:
          - name: skip_task
            args: {task_id: {ref: tasks.0}}

# --- query ------------------------------------------------------------------------------------

- id: query-today
  now: "2026-11-23T10:00:00+05:30"
  setup:
    tasks: [{title: "Submit SE assignment", due_at: "2026-11-23T17:00:00+05:30"}]
  turns:
    - say: "what's on today?"
      expect:
        intent: query  # today's snapshot is in the prompt, so no tool call is required

- id: query-free-tomorrow
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "when am I free tomorrow?"
      expect:
        intent: query
        tools:
          - name: get_free_slots
            args: {date: "2026-11-24"}

- id: query-habits
  now: "2026-11-23T10:00:00+05:30"
  setup:
    habits: [{name: "Reading", rrule: "FREQ=DAILY"}, {name: "DSA practice", rrule: "FREQ=DAILY"}]
  turns:
    - say: "how are my habits looking?"
      expect:
        intent: [query, review]
        tools:
          - name: get_habits_status

- id: query-project-tasks
  now: "2026-11-23T10:00:00+05:30"
  setup:
    tasks:
      - {title: "Graph problems set", project: "DSA"}
      - {title: "Buy groceries"}
  turns:
    - say: "list my DSA tasks"
      expect:
        intent: query
        tools:
          - name: list_tasks
            args: {project: {contains: "DSA"}}

- id: query-friday
  now: "2026-11-23T10:00:00+05:30"
  turns:
    - say: "what do I have on friday?"
      expect:
        intent: query
        tools:
          - name: get_today_overview
            args: {date: "2026-11-27"}

# --- plan -------------------------------------------------------------------------------------

- id: plan-today
  now: "2026-11-23T10:00:00+05:30"
  setup:
    tasks:
      - {title: "Submit SE assignment", due_at: "2026-11-23T17:00:00+05:30", estimate_min: 90}
      - {title: "Buy groceries"}
  turns:
    - say: "plan my day"
      expect:
        intent: plan
        tools:
          - name: propose_day_plan
            args: {date: {any_of: ["2026-11-23", null]}}

- id: plan-tomorrow
  now: "2026-11-23T22:30:00+05:30"
  setup:
    tasks: [{title: "DSA graphs revision", project: "DSA", estimate_min: 60}]
  turns:
    - say: "plan tomorrow for me, DSA first"
      expect:
        intent: plan
        tools:
          - name: propose_day_plan
            args: {date: "2026-11-24"}

- id: plan-evening-then-confirm
  now: "2026-11-23T16:00:00+05:30"
  setup:
    tasks: [{title: "Read OS chapter 4", estimate_min: 45}]
  turns:
    - say: "plan my evening"
      expect:
        intent: plan
        tools:
          - name: propose_day_plan
    - say: "looks good, lock it in"
      expect:
        intent: plan
        tools:
          - name: confirm_day_plan
            args: {plan_id: {present: true}}

- id: plan-within-window
  now: "2026-11-23T10:00:00+05:30"
  setup:
    tasks: [{title: "Laundry"}, {title: "Email professor"}]
  turns:
    - say: "I'm only free from 3 to 6 today, plan that"
      expect:
        intent: plan
        tools:
          - name: propose_day_plan
            args: {available_windows: {present: true}}

# --- review -----------------------------------------------------------------------------------

- id: review-week
  now: "2026-11-23T21:00:00+05:30"
  turns:
