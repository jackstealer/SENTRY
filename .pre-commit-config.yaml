# Local hooks reuse the versions pinned in uv.lock, so there is one source of truth.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy (strict, sentry_ai)
        entry: uv run mypy sentry_ai
        language: system
        types: [python]
        pass_filenames: false
