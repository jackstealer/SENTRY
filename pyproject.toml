[project]
name = "sentry-ai"
version = "0.1.0"
description = "SENTRY: a single-user, always-on personal AI that runs my daily routine"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.20,<2",
    "asyncpg>=0.32,<0.33",
    "fastapi>=0.165,<0.166",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "structlog>=26.1,<27",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=2.4,<3",
    "pre-commit>=4.7,<5",
    "pytest>=9.2,<10",
    "pytest-asyncio>=1.5,<2",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "sentry_ai"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # docs are spec; keep their code samples as written

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib", "--strict-markers"]
asyncio_mode = "auto"
# one loop for the whole run, so the cached async engine stays on the loop that created it
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
