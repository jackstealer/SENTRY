name: sentry

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      # dev-only credentials, matching DATABASE_URL in .env.example; the port is bound to
      # localhost only. Phase 14's production compose takes these from the environment.
      POSTGRES_USER: sentry
      POSTGRES_PASSWORD: sentry
      POSTGRES_DB: sentry
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentry -d sentry"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
